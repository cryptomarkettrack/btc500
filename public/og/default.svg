<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="78%" cy="6%" r="60%">
      <stop offset="0%" stop-color="#f7931a" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#f7931a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground -->
  <rect width="1200" height="630" fill="#0f0d0c"/>
  <ellipse cx="928" cy="60" rx="430" ry="160" fill="url(#glow)"/>

  <!-- Card -->
  <rect x="40" y="40" width="1120" height="550" rx="20" ry="20" fill="#171513" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Window bar -->
  <circle cx="80" cy="72" r="22" fill="#f7931a"/>
  <text x="80" y="80" text-anchor="middle" font-family="'Space Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">B</text>
  <text x="108" y="78" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="12" font-weight="600" letter-spacing="1.8" fill="#9c968c">btc500 / cycle map</text>
  <circle cx="1062" cy="76" r="5" fill="#4ade80"/>
  <text x="1074" y="80" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" font-weight="600" letter-spacing="1.8" fill="#9c968c">LIVE</text>

  <!-- Eyebrow -->
  <text x="60" y="112" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="12" font-weight="600" letter-spacing="2" fill="#f7931a">THE HALVING COUNTDOWN</text>

  <!-- Headline -->
  <text x="60" y="176" font-family="'Space Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#f7f4ef">Buy 500 days before</text>
  <text x="60" y="248" font-family="'Space Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="50" font-weight="800" fill="#f7f4ef">the halving. Sell 500 days after.</text>

  <!-- Cycle chart: rising line, buy low / sell high, halving in between -->
  <line x1="90" y1="380" x2="1030" y2="380" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="90" y1="440" x2="1030" y2="440" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <path d="M 90 500 L 220 472 L 360 428 L 500 388 L 640 368 L 780 344 L 920 318 L 1030 296"
        fill="none" stroke="#f7931a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="640" y1="368" x2="640" y2="540" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="640" y="352" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" font-weight="600" letter-spacing="1.6" fill="#9c968c">HALVING</text>

  <!-- BUY callout -->
  <circle cx="220" cy="472" r="6" fill="#f7931a" stroke="#171513" stroke-width="2"/>
  <line x1="220" y1="472" x2="220" y2="408" stroke="#f7931a" stroke-width="2" opacity="0.7"/>
  <text x="220" y="396" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="1.6" fill="#f7931a">BUY</text>

  <!-- SELL callout -->
  <circle cx="920" cy="318" r="6" fill="#f7931a" stroke="#171513" stroke-width="2"/>
  <line x1="920" y1="318" x2="920" y2="292" stroke="#f7931a" stroke-width="2" opacity="0.7"/>
  <text x="920" y="280" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="1.6" fill="#f7931a">SELL</text>
</svg>
