<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap');
      text { font-family: 'Inter', 'Arial', 'Helvetica', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0c0f1a"/>

  <!-- Solar eclipse circle (moon covering sun) -->
  <circle cx="600" cy="315" r="220" fill="#1a1d2e" opacity="0.15"/>
  <circle cx="600" cy="315" r="140" fill="#f97316" opacity="0.08"/>
  <circle cx="600" cy="315" r="80" fill="#0c0f1a"/>

  <!-- Corona glow -->
  <circle cx="600" cy="315" r="95" fill="none" stroke="rgba(249,115,22,0.15)" stroke-width="8"/>
  <circle cx="600" cy="315" r="110" fill="none" stroke="rgba(249,115,22,0.08)" stroke-width="4"/>

  <!-- Decorative circles -->
  <circle cx="1180" cy="-40" r="240" fill="rgba(249,115,22,0.12)"/>
  <circle cx="1160" cy="-20" r="180" fill="rgba(249,115,22,0.08)"/>
  <circle cx="-60" cy="690" r="240" fill="rgba(249,115,22,0.12)"/>
  <circle cx="-40" cy="670" r="180" fill="rgba(249,115,22,0.08)"/>

  <!-- Card -->
  <rect x="30" y="30" width="1140" height="570" rx="18" ry="18" fill="#111827" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Logo circle -->
  <circle cx="90" cy="100" r="38" fill="#f97316"/>

  <!-- Bitcoin B symbol (hand-drawn paths) -->
  <g transform="translate(72, 82)" fill="#0c0f1a">
    <rect x="6" y="0" width="4.5" height="36" rx="1"/>
    <rect x="22" y="0" width="4.5" height="36" rx="1"/>
    <rect x="4" y="0" width="25" height="4" rx="1"/>
    <rect x="4" y="32" width="25" height="4" rx="1"/>
    <path d="M 26 4 Q 38 4 38 13 Q 38 20 26 20 Z" fill="#0c0f1a"/>
    <path d="M 26 20 Q 38 20 38 28 Q 38 36 26 36 Z" fill="#0c0f1a"/>
  </g>

  <!-- BTC500 brand text -->
  <text x="142" y="110" font-weight="700" font-size="28" fill="#f97316" letter-spacing="0.5">BTC500</text>

  <!-- Heading - line 1 -->
  <text x="80" y="240" font-weight="800" font-size="52" fill="#ffffff">Solar Eclipse &amp; Bitcoin</text>
  <!-- Heading - line 2 -->
  <text x="80" y="310" font-weight="800" font-size="52" fill="#ffffff">Halving: Predictable Events</text>

  <!-- Subtitle -->
  <text x="80" y="370" font-size="22" fill="rgba(255,255,255,0.55)">What rare, predictable events tell us about timing the market</text>

  <!-- Feature pills -->
  <g transform="translate(80, 420)">
    <rect x="0" y="0" width="150" height="44" rx="22" fill="none" stroke="#f97316" stroke-width="1.5"/>
    <text x="75" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#f97316">Aug 12, 2026</text>

    <rect x="170" y="0" width="130" height="44" rx="22" fill="none" stroke="#f97316" stroke-width="1.5"/>
    <text x="235" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#f97316">Total Eclipse</text>

    <rect x="320" y="0" width="170" height="44" rx="22" fill="none" stroke="#f97316" stroke-width="1.5"/>
    <text x="405" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#f97316">BTC500 Strategy</text>

    <rect x="510" y="0" width="150" height="44" rx="22" fill="none" stroke="#f97316" stroke-width="1.5"/>
    <text x="585" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#f97316">Nov 30, 2026</text>
  </g>

  <!-- Date watermark -->
  <text x="80" y="560" font-size="16" fill="rgba(255,255,255,0.35)">August 15, 2026 · 7 min read</text>

  <!-- Domain watermark -->
  <text x="1110" y="575" text-anchor="end" font-size="17" fill="rgba(255,255,255,0.35)">btc500.net</text>
</svg>