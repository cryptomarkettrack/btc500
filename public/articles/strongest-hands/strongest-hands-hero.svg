<svg width="1536" height="1024" viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bitcoin's Strongest Hands Are Back — 90 Elite Wallets Hold 10,000+ BTC Each</title>
  <desc id="desc">BTC500 on-chain signal: the count of elite Bitcoin wallets holding over 10,000 BTC hit a six-month high of 90 in August 2026, a combined 900,000+ BTC.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b11"/>
      <stop offset="1" stop-color="#181218"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="cardg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c26"/>
      <stop offset="1" stop-color="#14141c"/>
    </linearGradient>
  </defs>
  <rect width="1536" height="1024" fill="url(#bg)"/>
  <circle cx="1350" cy="140" r="380" fill="none" stroke="#f97316" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="1350" cy="140" r="300" fill="none" stroke="#f97316" stroke-opacity="0.10" stroke-width="2"/>
  <circle cx="1350" cy="140" r="220" fill="none" stroke="#f97316" stroke-opacity="0.08" stroke-width="2"/>

  <rect x="88" y="80" width="1360" height="864" rx="36" fill="url(#cardg)" stroke="#2a2a36" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="128" y="170" font-size="34" font-weight="700" fill="#fb923c" letter-spacing="6">BTC500 · ON-CHAIN SIGNAL · AUG 11, 2026</text>

    <text x="124" y="284" font-size="92" font-weight="800" fill="#ffffff">Bitcoin's Strongest Hands</text>
    <text x="124" y="396" font-size="92" font-weight="800" fill="#ffffff">Are <tspan fill="#f97316">Back.</tspan></text>

    <rect x="124" y="460" width="300" height="186" rx="20" fill="#0f0f16" stroke="#f97316" stroke-width="3"/>
    <text x="160" y="585" font-size="150" font-weight="800" fill="#fb923c">90</text>
    <text x="160" y="628" font-size="24" font-weight="600" fill="#71717a" letter-spacing="3">ELITE WALLETS</text>

    <rect x="456" y="460" width="656" height="186" rx="20" fill="#0f0f16" stroke="#26262f" stroke-width="2"/>
    <text x="496" y="530" font-size="32" font-weight="700" fill="#ffffff">Each holding <tspan fill="#fb923c" font-weight="800">10,000+ BTC</tspan></text>
    <text x="496" y="584" font-size="26" fill="#a1a1aa">Six-month high. Accumulation continued through</text>
    <text x="496" y="626" font-size="26" fill="#a1a1aa">the Coldcard exploit and CLARITY Act delays.</text>

    <text x="128" y="732" font-size="34" font-weight="700" fill="#d4d4d8">900,000+ BTC combined <tspan fill="#f97316">≈ $58B+</tspan> at $65,000</text>

    <rect x="124" y="770" width="1292" height="108" rx="18" fill="#f97316"/>
    <text x="158" y="844" font-size="42" font-weight="800" fill="#0b0b11">BUY DATE NOV 30, 2026</text>
    <text x="1080" y="844" font-size="30" font-weight="700" fill="#0b0b11">111 days away →</text>
