<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#151c33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent stripe -->
  <rect x="0" y="0" width="16" height="630" fill="#f97316"/>

  <!-- Top label -->
  <text x="80" y="80" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="4" fill="#f97316">BTC500</text>

  <!-- Headline -->
  <text x="80" y="210" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff">Goldman Sachs</text>
  <text x="80" y="290" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800" fill="#0ea5e9">vs BlackRock</text>

  <text x="80" y="372" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600" fill="#f8fafc">The $2.25B bitcoin income ETF war</text>

  <!-- Big number -->
  <text x="80" y="520" font-family="Inter, Arial, sans-serif" font-size="150" font-weight="800" fill="url(#gold)">$2.25B</text>

  <!-- Bitcoin symbol -->
  <g transform="translate(1040,180)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#f97316" stroke-width="12"/>
    <path d="M 22 -68 L 22 68 M 22 -68 L -22 -68 L -22 -48 M 22 68 L -22 68 L -22 48 M 56 -16 L -56 -16 M 38 -36 L -38 -36 M 38 16 L -38 16"
          fill="none" stroke="#f97316" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Footer -->
  <text x="80" y="590" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#f8fafc">Buy 500 days before the halving. Sell 500 days after. btc500.net</text>
