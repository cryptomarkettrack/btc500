<svg width="1536" height="1024" viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SEC Cancels Regulation Crypto Vote — August 14, 2026</title>
  <desc id="desc">The SEC cancelled its August 14, 2026 open meeting on Regulation Crypto Assets with no new date. The BTC500 buy date remains November 30, 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b11"/>
      <stop offset="1" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="cardg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c26"/>
      <stop offset="1" stop-color="#14141c"/>
    </linearGradient>
  </defs>
  <rect width="1536" height="1024" fill="url(#bg)"/>
  <circle cx="1350" cy="140" r="380" fill="none" stroke="#f97316" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="1350" cy="140" r="300" fill="none" stroke="#f97316" stroke-opacity="0.10" stroke-width="2"/>
  <circle cx="1350" cy="140" r="220" fill="none" stroke="#f97316" stroke-opacity="0.08" stroke-width="2"/>

  <rect x="88" y="80" width="1360" height="864" rx="36" fill="url(#cardg)" stroke="#2a2a36" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="128" y="170" font-size="34" font-weight="700" fill="#fb923c" letter-spacing="6">BTC500 · POLICY · AUG 14, 2026</text>

    <text x="124" y="284" font-size="84" font-weight="800" fill="#ffffff">SEC Cancels</text>
    <text x="124" y="392" font-size="84" font-weight="800" fill="#ffffff">Regulation <tspan fill="#f97316">Crypto.</tspan></text>

    <rect x="124" y="460" width="520" height="186" rx="20" fill="#0f0f16" stroke="#f97316" stroke-width="3"/>
    <text x="156" y="545" font-size="64" font-weight="800" fill="#fb923c">CANCELLED</text>
    <text x="156" y="610" font-size="24" font-weight="600" fill="#71717a" letter-spacing="2">NO NEW DATE SET</text>

    <rect x="668" y="460" width="700" height="186" rx="20" fill="#0f0f16" stroke="#26262f" stroke-width="2"/>
    <text x="708" y="530" font-size="30" font-weight="700" fill="#ffffff">Friday 10:00 a.m. ET vote pulled</text>
    <text x="708" y="584" font-size="24" fill="#a1a1aa">CLARITY Act still stalled in the Senate.</text>
    <text x="708" y="626" font-size="24" fill="#a1a1aa">Bitcoin stays a digital commodity.</text>

    <rect x="124" y="770" width="1292" height="108" rx="18" fill="#f97316"/>
    <text x="158" y="844" font-size="42" font-weight="800" fill="#0b0b11">BUY DATE NOV 30, 2026</text>
    <text x="1060" y="844" font-size="30" font-weight="700" fill="#0b0b11">108 days away →</text>
  </g>
</svg>
